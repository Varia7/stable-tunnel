[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-tunnel"
version = "0.1.0"
description = "一键安装稳定的 SSH 反向隧道 systemd 服务"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    'tomli >= 2.0.0; python_version < "3.11"',
]

[project.scripts]
stable-tunnel = "stable_tunnel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stable_tunnel*"]

[tool.setuptools.package-data]
stable_tunnel = ["templates/*"]
